apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jobability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: jobability-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: jobability-config
            - secretRef:
                name: jobability-secrets
          readinessProbe:
            httpGet:
              path: /api/vacancies/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: jobability
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
